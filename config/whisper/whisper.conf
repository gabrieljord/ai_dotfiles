# ==============================================================================
# Whisper.cpp Configuration Parameters
# ==============================================================================

[audio]
sample_rate = 16000
channels = 1
format = "s16le"
silence_threshold = 2.0%
silence_duration = 1.2s

[model]
default_model = "ggml-large-v3-turbo.bin"
fallback_model = "ggml-base.en.bin"
language = "en"
translate = false
no_timestamps = true

[hardware]
threads = 4
gpu_layers = 0
processors = 1
flash_attn = false

[output]
clean_text = true
print_special = false
print_colors = false
